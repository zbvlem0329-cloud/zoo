<head>

</head>

<body>

    <h1> 동물 관리 프로그램</h1>

    <br>

                <th>이름</th>

            </tr>
        </thead>
        <tbody>

        </tbody>
        <tfoot>
        </tfoot>
    </table>
    <br>

    <h2>동물 상세 조회</h2>

    <div id="modal" onclick="closeModal();">
        <div id="todoDetailArea" onclick="f01(event);">
            <label>번호 :</label><span id="todoDetailNo">??</span>
            <br>
            <label>이름 :</label><span id="todoDetailName">??</span>
            <br>
            <label>나이 :</label><span id="todoDetailAge">??</span>
            <br>
            <label>성별 :</label><span id="todoDetailGender">??</span>

    </div>
